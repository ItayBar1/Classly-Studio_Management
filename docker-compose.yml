services:
  db:
    image: postgres:18
    container_name: classly-db
    restart: always
    environment:
      POSTGRES_USER: itay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: classly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./studio_management_schema_setup.sql:/docker-entrypoint-initdb.d/setup.sql
  loki:
    image: grafana/loki:3.0.0
    container_name: classly-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  grafana:
    image: grafana/grafana:11.0.0
    container_name: classly-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: always

  backend:
    build: ./server
    container_name: classly-api
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - db

  # השירות החדש להרצת סקריפטים ותחזוקה
  backend-tools:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder # <--- זה גורם לדוקר לעצור בשלב ה-node:20-alpine AS builder
    container_name: classly-tools
    env_file:
      - ./server/.env
    depends_on:
      - db
    # אנחנו לא צריכים ports או restart לכלים זמניים

  frontend:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
        - VITE_GRAFANA_URL=${VITE_GRAFANA_URL:-http://localhost:3001}
    container_name: classly-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro # TLS certificates (read-only)
      - certbot_webroot:/var/www/certbot:ro # ACME challenge files (read-only)
    env_file:
      - ./client/.env
    depends_on:
      - backend

  # Certbot — obtains and renews Let's Encrypt certificates.
  # Initial issuance: docker compose run --rm certbot certonly --webroot
  #   --webroot-path /var/www/certbot
  #   -d classly-studio-management.uk -d www.classly-studio-management.uk
  #   --email <your-email> --agree-tos --no-eff-email
  # Renewal (run via cron or manually): docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  cf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: classly-tunnel
    restart: always
    command: tunnel --no-autoupdate run --protocol http2 --token ${CF_TUNNEL_TOKEN}

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  letsencrypt:
  certbot_webroot:
