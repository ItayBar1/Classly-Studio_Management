services:
  db:
    image: postgres:18
    container_name: classly-db
    restart: always
    environment:
      POSTGRES_USER: itay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: classly_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./studio_management_schema_setup.sql:/docker-entrypoint-initdb.d/setup.sql
    networks:
      - classly_net

  loki:
    image: grafana/loki:3.0.0
    container_name: classly-loki
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: always
    networks:
      - classly_net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: classly-grafana
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: always
    networks:
      - classly_net

  backend:
    build: ./server
    container_name: classly-api
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - ./server/.env
    depends_on:
      - db
    networks:
      - classly_net

  # שירות להרצת סקריפטים ותחזוקה (מיגרציות Prisma וכו')
  backend-tools:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder
    container_name: classly-tools
    env_file:
      - ./server/.env
    depends_on:
      - db
    networks:
      - classly_net

  frontend:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_GRAFANA_URL=${VITE_GRAFANA_URL:-http://localhost:3001}
    container_name: classly-web
    restart: always
    env_file:
      - ./client/.env
    depends_on:
      - backend
    networks:
      - classly_net

  cf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: classly-tunnel
    restart: always
    command: tunnel --no-autoupdate run --protocol http2 --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - classly_net

volumes:
  postgres_data:
  loki_data:
  grafana_data:

networks:
  classly_net:
    driver: bridge
