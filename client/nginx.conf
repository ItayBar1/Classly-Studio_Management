# ─────────────────────────────────────────────
# HTTP — redirect to HTTPS + Let's Encrypt ACME
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name classly-studio-management.uk www.classly-studio-management.uk;

    # Let's Encrypt HTTP-01 challenge.
    # Must be the FIRST location block — Nginx uses longest-prefix match and
    # this prefix (/.well-known/acme-challenge/) must win over location /.
    # Certbot writes tokens to /var/www/certbot/.well-known/acme-challenge/TOKEN.
    # With root /var/www/certbot, Nginx resolves the URI to that exact path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        # Return 404 explicitly if the token file is missing rather than
        # falling through to any other handler.
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────
# HTTPS — main server
# ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name classly-studio-management.uk www.classly-studio-management.uk;

    # TLS certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/classly-studio-management.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classly-studio-management.uk/privkey.pem;

    # Modern TLS settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── ACME challenge — also served on 443 ───────
    # When Cloudflare's SSL mode is "Full" or "Full (Strict)", it proxies the
    # Let's Encrypt HTTP-01 request to the origin on port 443 (HTTPS) rather
    # than port 80. Without this block the request falls through to location /
    # and Nginx serves index.html, causing an "Unauthorized" error from the CA.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Gzip compression (P1) ─────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1000;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Vite hashed assets — immutable cache (P1) ─
    # All JS/CSS from Vite have content-hash filenames (/assets/*.js, /assets/*.css).
    # They never change for the same content, so we cache them for 1 year.
    #
    # NOTE: Nginx does not inherit add_header from parent blocks when a location
    # block defines its own add_header directives. Security headers must be
    # repeated in each location block that sets Cache-Control.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control           "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Static image / font assets — long cache ───
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control           "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Block dotfiles (e.g. .env, .git/config) ──
    # Bots routinely scan for exposed dotfiles. The SPA catch-all below would
    # return 200 + index.html for these paths, which is misleading and bad for
    # security scanners. Deny all dot-paths except /.well-known/ (ACME challenge).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── SPA entry point — always fresh ───────────
    # index.html must not be cached; it references the latest hashed asset URLs.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control           "no-cache" always;
    }

    # ── API proxy to backend — no caching ────────
    location /api/ {
        proxy_pass         http://classly-api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
