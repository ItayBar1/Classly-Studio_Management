# ═══════════════════════════════════════════════════════════════
# BOOTSTRAP CONFIG — HTTP only, no SSL
# ───────────────────────────────────────────────────────────────
# Purpose: allow Nginx to start BEFORE Let's Encrypt certificates
# exist so that Certbot can complete the HTTP-01 challenge and
# write the certs to the letsencrypt volume.
#
# After certs are issued, restore the full SSL config:
#   git show HEAD~1:client/nginx.conf > client/nginx.conf
#   git add client/nginx.conf && git commit -m "feat(nginx): restore full SSL config"
#   git push origin itay
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name classly-studio-management.uk www.classly-studio-management.uk;

    # ── Let's Encrypt HTTP-01 challenge ──────────────────────────
    # Certbot writes tokens to /var/www/certbot/.well-known/acme-challenge/TOKEN.
    # With root /var/www/certbot, Nginx resolves the URI to that exact path.
    # try_files $uri =404 returns a clean 404 if the token file is missing
    # instead of falling through to the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Redirect everything else to HTTPS ────────────────────────
    # Cloudflare handles the HTTPS termination on port 443.
    # This redirect is harmless during bootstrap — Certbot only
    # ever requests /.well-known/acme-challenge/*, which is caught above.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 server block intentionally absent ────────────────────────
# Nginx fails to start if ssl_certificate points to a file that
# does not yet exist. The 443 block is restored after cert issuance.
