server {
    listen 80;

    # הגשת קבצי ה-Frontend (React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- הוסף את החלק הזה ---
    # הפניית קריאות API לקונטיינר של ה-Backend
    location /api/ {
        # classly-api הוא שם הקונטיינר/השירות ב-docker-compose
        proxy_pass http://classly-api:5000/; 
        
        # הדרים (Headers) הכרחיים כדי שה-Backend יזהה את הלקוח המקורי
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # הגדלת זמן ההמתנה (למקרה שה-Backend איטי בבניית ה-DB)
        proxy_read_timeout 90;
    }
}