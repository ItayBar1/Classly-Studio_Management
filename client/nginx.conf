# ─────────────────────────────────────────────
# HTTP — Cloudflare Tunnel terminates TLS at the edge;
# this server receives plain HTTP from cloudflared.
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name classly-studio-management.uk www.classly-studio-management.uk;

    # ── Gzip compression ────────────────────────
    gzip              on;
    gzip_vary          on;
    gzip_min_length   1000;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Vite hashed assets — immutable cache ────
    location /assets/ {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control           "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Static image / font assets — long cache ─
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control           "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Block dotfiles (e.g. .env, .git/config) ─
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── SPA entry point — strictly no cache ─────
    # טיפול מפורש באינדקס כדי למנוע ChunkLoadError ב-Deployments
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    }

    # ── General SPA routing ─────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        
        # ברירת מחדל לשאר הנתיבים (מוודא בדיקה מול השרת)
        add_header Cache-Control           "no-cache" always;
    }

    # ── API proxy to backend — no caching ───────
    location /api/ {
        proxy_pass          http://classly-api:5000;
        proxy_http_version 1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}