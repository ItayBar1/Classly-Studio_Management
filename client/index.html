    <!-- Dark-mode FOUC prevention — must stay inline and run before first paint -->
    <script>
      (function () {
        var t = localStorage.getItem("classly_theme");
        if (
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
